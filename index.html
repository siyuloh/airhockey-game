<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape"
    />
    <title>SIYUL HOCKEY</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #111;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      /* 메인 메뉴 화면 */
      #menuScreen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(11, 26, 36, 0.95);
        z-index: 10;
      }
      #menuScreen h1 {
        font-size: 2.5rem;
        color: #00ffcc;
        text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        margin-bottom: 20px;
        letter-spacing: 3px;
      }
      .menu-btn {
        background: linear-gradient(135deg, #00ffcc, #0088cc);
        border: none;
        color: #0b1a24;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 12px 35px;
        margin: 8px;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
      }
      .menu-btn:active {
        transform: scale(0.95);
      }

      /* 게임 플레이 화면 (상단 UI + 하단 가로형 캔버스 구조) */
      #gameScreen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 5px;
        position: relative;
      }

      /* 중앙 상단 헤더 컨테이너 (제목, 버튼, 점수판) */
      #topHeader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-bottom: 6px;
        z-index: 5;
      }

      h1.game-title {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 2px;
        color: #00ffcc;
        text-align: center;
      }

      #gameTopControls {
        display: flex;
        gap: 8px;
      }
      .control-btn {
        background: #222;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        padding: 3px 10px;
        border-radius: 8px;
        font-size: 0.65rem;
        font-weight: bold;
        cursor: pointer;
      }
      .control-btn:active {
        background: #00ffcc;
        color: #111;
      }

      #scoreboard {
        font-size: 0.85rem;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.1);
        padding: 3px 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
      }

      /* 가로모드 최적화 캔버스 크기 */
      canvas {
        background: #002b36;
        border: 3px solid #00ffcc;
        border-radius: 6px;
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        max-width: 95vw;
        max-height: 75vh;
        object-fit: contain;
      }

      #instructions {
        font-size: 0.55rem;
        color: #aaa;
        text-align: center;
        margin-top: 3px;
      }

      /* 승리 결과 오버레이 화면 */
      #gameOverScreen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
      }
      #winnerText {
        font-size: 2.2rem;
        font-weight: bold;
        margin-bottom: 20px;
        letter-spacing: 2px;
        text-shadow: 0 0 20px currentColor;
      }
      .overlay-btn-group {
        display: flex;
        gap: 15px;
      }
      .overlay-btn {
        background: linear-gradient(135deg, #00ffcc, #0088cc);
        border: none;
        color: #0b1a24;
        font-size: 1rem;
        font-weight: bold;
        padding: 10px 25px;
        border-radius: 18px;
        cursor: pointer;
      }
      .overlay-btn.secondary {
        background: linear-gradient(135deg, #ff3333, #aa0033);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="menuScreen">
      <h1>SIYUL HOCKEY</h1>
      <button class="menu-btn" onclick="startGame(1)">게임 시작 (1P)</button>
      <button class="menu-btn" onclick="startGame(2)">게임 시작 (2P)</button>
    </div>

    <div id="gameScreen">
      <div id="topHeader">
        <h1 class="game-title">SIYUL HOCKEY</h1>
        <div id="gameTopControls">
          <button class="control-btn" onclick="restartGame()">다시하기</button>
          <button class="control-btn" onclick="returnToMenu()">
            메인 화면
          </button>
        </div>
        <div id="scoreboard">
          <span style="color: #ff3333">RED</span> <span id="redScore">0</span> :
          <span id="blueScore">0</span>
          <span style="color: #00ffcc">BLUE</span> (5점 선취)
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="450"></canvas>
      <div id="instructions">
        좌측 영역: BLUE 팀 | 우측 영역: RED 팀 (스마트폰 가로모드 최적화)
      </div>

      <div id="gameOverScreen">
        <div id="winnerText">BLUE 승리!</div>
        <div class="overlay-btn-group">
          <button class="overlay-btn secondary" onclick="restartGame()">
            다시하기
          </button>
          <button class="overlay-btn" onclick="returnToMenu()">
            메인 화면
          </button>
        </div>
      </div>
    </div>

    <script>
      const menuScreen = document.getElementById("menuScreen");
      const gameScreen = document.getElementById("gameScreen");
      const gameOverScreen = document.getElementById("gameOverScreen");
      const winnerText = document.getElementById("winnerText");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const redScoreEl = document.getElementById("redScore");
      const blueScoreEl = document.getElementById("blueScore");

      let gameMode = 1;
      let gameRunning = false;
      let redScore = 0;
      let blueScore = 0;
      const WIN_SCORE = 5;

      let screenShakeTime = 0;
      let screenShakeIntensity = 0;

      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      function playSound(type) {
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === "hit") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "wall") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.05);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "goal") {
          osc.type = "square";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(330, now + 0.1);
          osc.frequency.setValueAtTime(440, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }
      }

      function triggerShake(intensity, duration) {
        screenShakeIntensity = intensity;
        screenShakeTime = duration;
      }

      const puck = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 12,
        speed: 9,
        velocityX: 6,
        velocityY: (Math.random() - 0.5) * 4,
        color: "#ffea00",
      };

      const bluePlayer = {
        // 좌측 (BLUE 팀)
        x: 60,
        y: canvas.height / 2,
        radius: 25,
        color: "#00ffcc",
        targetX: 60,
        targetY: canvas.height / 2,
      };

      const redPlayer = {
        // 우측 (RED 팀)
        x: canvas.width - 60,
        y: canvas.height / 2,
        radius: 25,
        speed: 4.8,
        color: "#ff3333",
        targetX: canvas.width - 60,
        targetY: canvas.height / 2,
      };

      function startGame(mode) {
        initAudio();
        gameMode = mode;
        redScore = 0;
        blueScore = 0;
        redScoreEl.textContent = "0";
        blueScoreEl.textContent = "0";

        gameOverScreen.style.display = "none";
        menuScreen.style.display = "none";
        gameScreen.style.display = "flex";

        resetPuck("blue");
        gameRunning = true;
      }

      function restartGame() {
        startGame(gameMode);
      }

      function returnToMenu() {
        gameRunning = false;
        gameOverScreen.style.display = "none";
        gameScreen.style.display = "none";
        menuScreen.style.display = "flex";
      }

      function checkWinCondition() {
        if (redScore >= WIN_SCORE) {
          gameRunning = false;
          winnerText.textContent = "RED 승리!";
          winnerText.style.color = "#ff3333";
          gameOverScreen.style.display = "flex";
        } else if (blueScore >= WIN_SCORE) {
          gameRunning = false;
          winnerText.textContent = "BLUE 승리!";
          winnerText.style.color = "#00ffcc";
          gameOverScreen.style.display = "flex";
        }
      }

      function handlePointerInput(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;

        if (y < bluePlayer.radius) y = bluePlayer.radius;
        if (y > canvas.height - bluePlayer.radius)
          y = canvas.height - bluePlayer.radius;

        if (x <= canvas.width / 2) {
          if (x < bluePlayer.radius) x = bluePlayer.radius;
          if (x > canvas.width / 2 - bluePlayer.radius)
            x = canvas.width / 2 - bluePlayer.radius;
          bluePlayer.targetX = x;
          bluePlayer.targetY = y;
        } else if (gameMode === 2) {
          if (x < canvas.width / 2 + redPlayer.radius)
            x = canvas.width / 2 + redPlayer.radius;
          if (x > canvas.width - redPlayer.radius)
            x = canvas.width - redPlayer.radius;
          redPlayer.targetX = x;
          redPlayer.targetY = y;
        }
      }

      canvas.addEventListener("mousemove", (e) => {
        if (!gameRunning) return;
        handlePointerInput(e.clientX, e.clientY);
      });

      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (!gameRunning) return;
          for (let i = 0; i < e.touches.length; i++) {
            handlePointerInput(e.touches[i].clientX, e.touches[i].clientY);
          }
        },
        { passive: true },
      );

      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (!gameRunning) return;
          for (let i = 0; i < e.touches.length; i++) {
            handlePointerInput(e.touches[i].clientX, e.touches[i].clientY);
          }
        },
        { passive: true },
      );

      function checkCollision(entity, puck) {
        const dx = puck.x - entity.x;
        const dy = puck.y - entity.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < entity.radius + puck.radius) {
          const angle = Math.atan2(dy, dx);
          const speed = Math.sqrt(
            puck.velocityX * puck.velocityX + puck.velocityY * puck.velocityY,
          );

          const newSpeed = Math.min(speed + 2.5, 16);
          puck.velocityX = Math.cos(angle) * newSpeed;
          puck.velocityY = Math.sin(angle) * newSpeed;

          const overlap = entity.radius + puck.radius - distance;
          puck.x += Math.cos(angle) * overlap;
          puck.y += Math.sin(angle) * overlap;

          playSound("hit");
          triggerShake(Math.min(newSpeed * 0.9, 8), 12);
        }
      }

      function update() {
        if (!gameRunning) return;

        bluePlayer.x += (bluePlayer.targetX - bluePlayer.x) * 0.35;
        bluePlayer.y += (bluePlayer.targetY - bluePlayer.y) * 0.35;

        if (gameMode === 1) {
          if (puck.x > canvas.width / 2) {
            if (redPlayer.y < puck.y) redPlayer.y += redPlayer.speed;
            if (redPlayer.y > puck.y) redPlayer.y -= redPlayer.speed;
          } else {
            if (redPlayer.y < canvas.height / 2) redPlayer.y += redPlayer.speed;
            if (redPlayer.y > canvas.height / 2) redPlayer.y -= redPlayer.speed;
          }
          if (redPlayer.y < redPlayer.radius) redPlayer.y = redPlayer.radius;
          if (redPlayer.y > canvas.height - redPlayer.radius)
            redPlayer.y = canvas.height - redPlayer.radius;

          if (redPlayer.x < canvas.width - 100)
            redPlayer.x = canvas.width - 100;
        } else {
          redPlayer.x += (redPlayer.targetX - redPlayer.x) * 0.35;
          redPlayer.y += (redPlayer.targetY - redPlayer.y) * 0.35;
        }

        puck.x += puck.velocityX;
        puck.y += puck.velocityY;

        if (puck.y - puck.radius < 0) {
          puck.y = puck.radius;
          puck.velocityY *= -1;
          playSound("wall");
        } else if (puck.y + puck.radius > canvas.height) {
          puck.y = canvas.height - puck.radius;
          puck.velocityY *= -1;
          playSound("wall");
        }

        const goalTop = canvas.height / 2 - 60;
        const goalBottom = canvas.height / 2 + 60;

        if (puck.x - puck.radius < 0) {
          if (puck.y > goalTop && puck.y < goalBottom) {
            redScore++;
            redScoreEl.textContent = redScore;
            playSound("goal");
            triggerShake(10, 20);
            checkWinCondition();
            if (gameRunning) resetPuck("blue");
          } else {
            puck.x = puck.radius;
            puck.velocityX *= -1;
            playSound("wall");
          }
        }

        if (puck.x + puck.radius > canvas.width) {
          if (puck.y > goalTop && puck.y < goalBottom) {
            blueScore++;
            blueScoreEl.textContent = blueScore;
            playSound("goal");
            triggerShake(10, 20);
            checkWinCondition();
            if (gameRunning) resetPuck("red");
          } else {
            puck.x = canvas.width - puck.radius;
            puck.velocityX *= -1;
            playSound("wall");
          }
        }

        checkCollision(bluePlayer, puck);
        checkCollision(redPlayer, puck);

        puck.velocityX *= 0.995;
        puck.velocityY *= 0.995;

        const currentSpeed = Math.sqrt(
          puck.velocityX * puck.velocityX + puck.velocityY * puck.velocityY,
        );
        if (currentSpeed < 5 && currentSpeed > 0) {
          puck.velocityX *= 1.3;
          puck.velocityY *= 1.3;
        }
      }

      function resetPuck(lastScorer) {
        puck.x = canvas.width / 2;
        puck.y = canvas.height / 2;
        puck.velocityX = lastScorer === "blue" ? -7 : 7;
        puck.velocityY = (Math.random() - 0.5) * 6;
      }

      function draw() {
        ctx.save();

        if (screenShakeTime > 0) {
          const offsetX = (Math.random() - 0.5) * screenShakeIntensity;
          const offsetY = (Math.random() - 0.5) * screenShakeIntensity;
          ctx.translate(offsetX, offsetY);
          screenShakeTime--;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2 - 60);
        ctx.lineTo(0, canvas.height / 2 + 60);
        ctx.stroke();

        ctx.strokeStyle = "#ff3333";
        ctx.beginPath();
        ctx.moveTo(canvas.width, canvas.height / 2 - 60);
        ctx.lineTo(canvas.width, canvas.height / 2 + 60);
        ctx.stroke();

        ctx.fillStyle = bluePlayer.color;
        ctx.beginPath();
        ctx.arc(bluePlayer.x, bluePlayer.y, bluePlayer.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = redPlayer.color;
        ctx.beginPath();
        ctx.arc(redPlayer.x, redPlayer.y, redPlayer.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = puck.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = puck.color;
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    </script>
  </body>
</html>
